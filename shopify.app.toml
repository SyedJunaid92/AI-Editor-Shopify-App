# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
name = "AI Editor"
client_id = "3ec4b652dcf48431e7449c0c437628c7"
application_url = "https://ai-editor-ivory.vercel.app"
embedded = true
handle = "appify-ai-editor"

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# read_themes lists theme files for the editor. write_themes applies generated
# Liquid to a theme and requires a Shopify theme-file API exemption for public apps.
scopes = "read_themes,write_themes"

[auth]
redirect_urls = [
  "https://ai-editor-ivory.vercel.app/auth/callback",
  "https://ai-editor-ivory.vercel.app/auth/shopify/callback",
  "https://ai-editor-ivory.vercel.app/api/auth",
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app/subscriptions_update"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]
